# Reference deployment (spec 14.1). Credentials come from .env / your secret manager, never from this file.
# Set POSTGRES_PASSWORD in your shell or a compose-level .env (not the app .env), e.g.:
#   POSTGRES_PASSWORD=$(openssl rand -hex 16) docker compose up -d
# and use the same password inside DATABASE_URL in .env.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: cxdash
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cx -d cxdash"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
  migrate:
    build: .
    command: ["python", "-m", "cxdash.cli", "migrate"]
    env_file: .env
    depends_on: { db: { condition: service_healthy } }
  web:
    build: .
    env_file: .env
    environment: { WEB_HOST: "0.0.0.0" }
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
    ports: ["127.0.0.1:8050:8050"]   # bind to loopback; publish through your TLS reverse proxy
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
  worker:
    build: .
    command: ["python", "-m", "cxdash.sync.scheduler"]
    env_file: .env
    depends_on:
      migrate: { condition: service_completed_successfully }
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    # run exactly one worker
volumes:
  pgdata: {}
